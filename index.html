<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js messaround</title>
</head>
<body id="background">
    <h1>lets learn javascript</h1>
    <h2>lets learn about onlick and alerts</h2>
    <a href="https://www.pinterest.com" onclick="alert('warning! you are about to leave the page')">pinterest</a>
    <h2>how do we display and hide text?</h2>
    <h2>what's my secret identity</h2>
    <p id="secret"></p>
    <button onclick="document.getElementById('secret').innerHTML='i have a big brain, im megamind'; document.getElementById('secret').style.display='block';">reveal!</button>
    <button onclick="document.getElementById('secret').style.display='None';">hide</button>

    <h2>how do i change an image in javascript?</h2>
    <img src="images/bulb_on.jpg" id="myimage" style="height:200px; width: 200px; object-fit: cover;">
    <button onclick="document.getElementById('myimage').src='images/bulb_off.jpg';">bulb off</button>
    <button onclick="document.getElementById('myimage').src='images/bulb_on.jpg';">bulb on</button>
    
    <p id="alice">hi, i am alice</p>
    
    <button onclick="document.getElementById('alice').style.color='blue';document.getElementById('alice').style.fontSize='5px'">cake - eat me!</button>
    <button onclick="document.getElementById('alice').style.color='purple';document.getElementById('alice').style.fontSize='50px'">potion - drink me!</button>

    <button id="rainbowbutton" style="border-radius:15px; padding:15px; background-color:rgb(245, 244, 247);"onclick="document.getElementById('rainbowbutton').style.background='linear-gradient(to right, #6a11cb, #2575fc)';">make me coooooolll</button>
    <button onclick="document.getElementById('background').style.backgroundColor='#6a11cb';">turn everything purple</button>
</body>
</html>
